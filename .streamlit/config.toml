[theme]
base = "light"
primaryColor = "#1C1A17"
backgroundColor = "#FBF8F3"
secondaryBackgroundColor = "#F3EEE5"
textColor = "#1C1A17"
borderColor = "#E4DCCF"
linkColor = "#1C1A17"
baseRadius = "4px"
font = "Schibsted Grotesk:https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap, serif"

[theme.sidebar]
backgroundColor = "#F3EEE5"
secondaryBackgroundColor = "#EBE4D8"

[client]
toolbarMode = "minimal"
